# Builds and tests Guppy for Mac on every push to main and on pull requests.
# It doesn't publish anything; releases come from release.yml.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests
        run: swift test

      - name: Build Guppy.app and Guppy.dmg
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Guppy-mac
          path: build/Guppy.dmg
